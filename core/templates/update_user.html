{% extends 'base.html' %}


{% block content %}


 <!-- Header-->
        <header class="bg-dark py-5">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Modifier profil </h1>
                    <p class="lead fw-normal text-white-50 mb-0">Modifier profil utilisateur...</p>
                </div>
            </div>
        </header>
        <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
        
<form method="post" action="{% url 'update_user' %}">

    {% csrf_token %}    
     
{{ user_form.as_p }}

<br/><br/>
<div class="mb-3">
<center>
    <button type="submit" class="btn btn-primary" >Modifier profil</button>
</center>
</div>
</div>
</div>

</form>

<!-- Button to change password -->
<div class="row justify-content-center mt-3">
    <div class="col-md-6 text-center">
        <a href="{% url 'update_password' %}" class="btn btn-outline-secondary">Modifier mon mot de passe</a>
    </div>
</div>

<br/><br/>

</div>
{% endblock %}
